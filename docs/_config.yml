title: Notes on Redis
description: Redis Open Source, Redis Cloud, Enterprise, Iris, comparisons and deep dives — hands-on labs (EN/KO/中文/日本語/ไทย/ID/MS)
lang: en

# Served at https://redis.litkhai.dev (Vercel). litkhai.github.io/notes-on-redis
# will publish redirect stubs built from the same pages once the host is live.
baseurl: ""
url: "https://redis.litkhai.dev"

repo_url: https://github.com/litkhai/notes-on-redis

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# No remote theme on purpose — a self-contained layout has no upstream
# gem-compatibility risk and gives full control over the language toggle.
# 원격 테마를 쓰지 않는다. 자체 레이아웃은 gem 호환성 문제가 없고
# 언어 토글을 완전히 제어할 수 있다.
theme: null
plugins: []

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - vercel.json

# Site languages (#68, design/lang-urls.md). English at the root, the others under
# /<code>/. `tag` is the BCP 47 tag for <html lang> and hreflang, `og` the og:locale,
# `banner` the line offering this language on a page in another one.
# 사이트 언어. 영어는 루트, 나머지는 /<code>/ 아래. `banner` 는 다른 언어 페이지에서
# 이 언어를 제안하는 한 줄.
languages:
  - { code: en, tag: en,      og: en_US, short: EN, label: English,          prefix: "",  banner: "This page is also in English" }
  - { code: ko, tag: ko,      og: ko_KR, short: KO, label: 한국어,           prefix: /ko, banner: "이 페이지는 한국어로도 있습니다" }
  - { code: zh, tag: zh-Hans, og: zh_CN, short: 中, label: 简体中文,         prefix: /zh, banner: "本页也有简体中文版" }
  - { code: ja, tag: ja,      og: ja_JP, short: 日, label: 日本語,           prefix: /ja, banner: "このページは日本語でも読めます" }
  - { code: th, tag: th,      og: th_TH, short: TH, label: ภาษาไทย,          prefix: /th, banner: "หน้านี้มีภาษาไทยด้วย" }
  - { code: id, tag: id,      og: id_ID, short: ID, label: Bahasa Indonesia, prefix: /id, banner: "Halaman ini juga tersedia dalam Bahasa Indonesia" }
  - { code: ms, tag: ms,      og: ms_MY, short: MS, label: Bahasa Melayu,    prefix: /ms, banner: "Halaman ini juga tersedia dalam Bahasa Melayu" }

# Nav, grouped. A divider is drawn wherever `group` changes. Labels are
# English only — the language toggle switches page content, not the chrome.
# `group` is not displayed; the layout reads it only to place dividers.
# 그룹으로 나눈 네비게이션. `group` 이 바뀌는 지점마다 구분선이 그려진다.
# 라벨은 영문만. 언어 토글이 바꾸는 것은 본문이지 UI 가 아니다.
nav:
  # Start here / 시작
  - { title: Overview, url: /, group: start }
  - { title: Setup, url: /setup/, group: start }

  # How it is deployed / 배치
  - { title: Architecture, url: /architecture/, group: architecture }

  # The product tracks / 제품 트랙
  - { title: Redis Cloud, url: /cloud/, group: products }
  - { title: Enterprise, url: /enterprise/, group: products }
  - { title: Iris, url: /iris/, group: products }

  # Side by side with the alternatives / 대안과 나란히
  - { title: Compare, url: /compare/, group: compare }

  # Mechanisms / 동작 원리
  - { title: Deep Dive, url: /deep-dive/, group: readings }

  # The repository itself / 저장소 자체
